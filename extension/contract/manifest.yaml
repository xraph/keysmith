schemaVersion: 1
contributor:
  name: keysmith
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [keysmith.read, keysmith.write]

# No app block and no graph: the React plugin owns routes. Every intent is
# answered for the tenant tenantFrom resolves; no request field names a
# tenant, and no response carries a key hash. Only keys.create and keys.rotate return a raw key.
intents:
  - { name: keys.list,   kind: query, version: 1, capability: read }
  - { name: keys.detail, kind: query, version: 1, capability: read }
  - { name: policies.list, kind: query, version: 1, capability: read }
  - { name: policies.detail, kind: query, version: 1, capability: read }
  - { name: scopes.list,   kind: query, version: 1, capability: read }
  # Answers a raw key, once (keys.rotate is the other). overview arrives in a
  # later slice; the loader does not check invalidates names.
  - { name: keys.create, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, overview, policies.detail] }
  # Answers a raw key, once.
  - { name: keys.rotate, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, rotations.list, overview] }
  - { name: keys.endGrace, kind: command, version: 1, capability: write, invalidates: [keys.detail, rotations.list, overview] }
  # A revoke stops a key blocking its policy's delete, so the policy page refreshes.
  - { name: keys.revoke, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, rotations.list, overview, policies.detail] }
  - { name: keys.suspend, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, overview] }
  - { name: keys.reactivate, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, overview] }
  - { name: keys.scopes.assign, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail] }
  - { name: keys.scopes.remove, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail] }
  - { name: policies.create, kind: command, version: 1, capability: write, invalidates: [policies.list, overview] }
  # An edit changes the policy a key's detail shows.
  - { name: policies.update, kind: command, version: 1, capability: write, invalidates: [policies.list, policies.detail, keys.detail] }

queries:
  keysList:
    intent: keys.list
    cache: { staleTime: 30s }
  keyDetail:
    intent: keys.detail
    cache: { staleTime: 30s }
  policiesList:
    intent: policies.list
    cache: { staleTime: 30s }
  policyDetail:
    intent: policies.detail
    cache: { staleTime: 30s }
  scopesList:
    intent: scopes.list
    cache: { staleTime: 30s }
