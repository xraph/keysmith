schemaVersion: 1
contributor:
  name: keysmith
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [keysmith.read, keysmith.write]

# No app block and no graph: the React plugin owns routes. Every intent is
# answered for the tenant tenantFrom resolves; no request field names a
# tenant, and no response carries a key hash. Only keys.create and keys.rotate return a raw key.
intents:
  - { name: keys.list,   kind: query, version: 1, capability: read }
  - { name: keys.detail, kind: query, version: 1, capability: read }
  - { name: policies.list, kind: query, version: 1, capability: read }
  - { name: policies.detail, kind: query, version: 1, capability: read }
  - { name: scopes.list,   kind: query, version: 1, capability: read }
  # Newest first. keyId is a filter: another tenant's key answers [].
  - { name: rotations.list, kind: query, version: 1, capability: read }
  # Every UTC bucket in range, empty ones included, at most 400. keyId is a
  # filter here too: another tenant's key answers empty buckets.
  - { name: usage.series, kind: query, version: 1, capability: read }
  # Newest first, with the total that match.
  - { name: usage.records, kind: query, version: 1, capability: read }
  # Keys by state, open windows, keys expiring within 7 days, requests in the
  # last 24h (null when the tenant has never recorded usage), the 5 newest
  # keys and rotations, and how many policy fields this deployment enforces.
  - { name: overview, kind: query, version: 1, capability: read }
  # Answers a raw key, once (keys.rotate is the other).
  - { name: keys.create, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, overview, policies.detail] }
  # Answers a raw key, once.
  - { name: keys.rotate, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, rotations.list, overview] }
  - { name: keys.endGrace, kind: command, version: 1, capability: write, invalidates: [keys.detail, rotations.list, overview] }
  # A revoke stops a key blocking its policy's delete, so the policy page refreshes.
  - { name: keys.revoke, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, rotations.list, overview, policies.detail] }
  - { name: keys.suspend, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, overview] }
  - { name: keys.reactivate, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail, overview] }
  - { name: keys.scopes.assign, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail] }
  - { name: keys.scopes.remove, kind: command, version: 1, capability: write, invalidates: [keys.list, keys.detail] }
  - { name: policies.create, kind: command, version: 1, capability: write, invalidates: [policies.list, overview] }
  # An edit changes the policy a key's detail shows.
  - { name: policies.update, kind: command, version: 1, capability: write, invalidates: [policies.list, policies.detail, keys.detail] }
  # Refuses while a key that is not revoked uses the policy. A revoked key
  # keeps its policyId, and its detail then reads the policy as none, so
  # keys.detail refreshes too.
  - { name: policies.delete, kind: command, version: 1, capability: write, invalidates: [policies.list, policies.detail, overview, keys.detail] }
  - { name: scopes.create, kind: command, version: 1, capability: write, invalidates: [scopes.list, overview] }
  # Takes the scope off every key that holds it, and both key views show
  # scopes. Refuses while other scopes name it as their parent, or while a
  # policy lists it in allowedScopes.
  - { name: scopes.delete, kind: command, version: 1, capability: write, invalidates: [scopes.list, keys.list, keys.detail, overview] }

queries:
  keysList:
    intent: keys.list
    cache: { staleTime: 30s }
  keyDetail:
    intent: keys.detail
    cache: { staleTime: 30s }
  policiesList:
    intent: policies.list
    cache: { staleTime: 30s }
  policyDetail:
    intent: policies.detail
    cache: { staleTime: 30s }
  scopesList:
    intent: scopes.list
    cache: { staleTime: 30s }
  rotationsList:
    intent: rotations.list
    cache: { staleTime: 30s }
  usageSeries:
    intent: usage.series
    cache: { staleTime: 30s }
  usageRecords:
    intent: usage.records
    cache: { staleTime: 30s }
  overview:
    intent: overview
    cache: { staleTime: 30s }
